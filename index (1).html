<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YL Inspection Kit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f28a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="YL Inspection Kit">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#1c1c1a;--mut:#6b6b66;--line:#d9d9d4;--acc:#e8730c;--fld:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--panel:#222220;--ink:#eeeeea;--mut:#9a9a94;--line:#3a3a36;--fld:#2b2b28}}
:root[data-theme="dark"]{--bg:#161615;--panel:#222220;--ink:#eeeeea;--mut:#9a9a94;--line:#3a3a36;--fld:#2b2b28}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:20px;padding:20px;max-width:1500px;margin:auto}
@media(max-width:1000px){.app{grid-template-columns:1fr;padding:12px}}
.form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;align-self:start}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
fieldset{border:0;border-top:1px solid var(--line);margin:14px 0 0;padding:12px 0 0}
legend{font-weight:600;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.04em;padding-right:8px}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--fld);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
textarea{resize:vertical;min-height:62px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);background:var(--fld);color:var(--ink);padding:7px 12px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
.item img{width:64px;height:64px;object-fit:cover;border-radius:5px}
.item .row{gap:6px}.item label{margin:0 0 2px;font-size:11px}
.x{padding:2px 8px;line-height:1.2}
.cm{display:flex;gap:6px;margin-top:6px}
.prev{overflow-x:auto}
.paper{background:#fff;color:#000;width:794px;max-width:none;margin:0 auto 20px;padding:44px 48px;font:13px/1.35 "Noto Serif",Georgia,"Times New Roman",serif;box-shadow:0 2px 12px rgba(0,0,0,.18);min-height:1050px}
.hd{text-align:center;margin-bottom:14px}
.logo{display:inline-flex;align-items:center;gap:10px}
.dot{width:58px;height:58px;border-radius:50%;background:#f28a12;color:#e11d48;font:800 24px/58px Arial,sans-serif}
.co{text-align:left;font-family:Arial,Helvetica,sans-serif}
.co b{display:block;font-size:24px;letter-spacing:.2px}
.co span{font-size:10px}
.addr{font:10px Arial,sans-serif;margin-top:4px}
.refno{text-align:right;margin:18px 0 8px}
.title{text-align:center;font-weight:700;text-decoration:underline;font-size:15px;margin:10px 0 14px}
table.k{width:100%;border-collapse:collapse}
table.k td{padding:3px 0;border-bottom:1px solid #bbb;vertical-align:top}
table.k td:first-child{width:190px;font-weight:700;border:0}
.paper p{margin:0 0 12px;text-align:justify;white-space:pre-wrap}
.u{text-decoration:underline;margin-top:22px}
table.cm2{width:100%;border-collapse:collapse;margin:20px 0}
table.cm2 th,table.cm2 td{border:1px solid #777;padding:3px 8px;text-align:center;height:22px}
table.cm2 td:nth-child(2){text-align:left}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:42px;margin-top:10px}
.sig .ln{border-bottom:1px solid #999;margin-top:18px}
.ph{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 32px}
figure{margin:0;break-inside:avoid}
figure h4{margin:0 0 4px;font-size:14px}
.imgw{position:relative;border:1px solid #444;aspect-ratio:1/1;overflow:hidden;background:#ddd}
.imgw img{width:100%;height:100%;object-fit:cover;display:block}
.imgw i{position:absolute;right:12px;bottom:8px;color:#fff;font-size:11.5px;text-shadow:0 0 3px #000}
figcaption{margin-top:5px}
@media print{
 @page{size:A4;margin:10mm}
 body{background:#fff}
 .form{display:none}
 .app{display:block;padding:0}
 .prev{overflow:visible}
 .paper{box-shadow:none;width:auto;margin:0;padding:0;min-height:0}
 .ph{break-before:page}
}
</style>
</head>
<body>
<div class="app">
<div class="form">
  <h1>LEW Attendance Report</h1>
  <p class="sub">Fill in the details. The report on the right updates live.</p>

  <fieldset><legend>Report</legend>
    <label>Reference No.</label><input id="ref" value="INP0000061266">
  </fieldset>

  <fieldset><legend>Site details</legend>
    <label>Town Council</label><input id="tc" value="Jalan Besar Town Council">
    <label>Town Address</label><input id="addr" value="Blk 70 Geylang Bahru, #01-2719, S330070">
    <label>Location (Outage)</label><input id="loc" value="Blk 14, Joo Seng Road (360014)">
    <div class="row">
      <div><label>Date Activated</label><input id="act" type="date" value="2025-02-08"></div>
      
    </div>
    <div class="row">
      <div><label>Arrived at site</label><input id="arr" type="datetime-local" value="2025-02-08T12:30"></div>
      <div><label>Completed</label><input id="comp" type="datetime-local" value="2025-02-08T13:03"></div>
    </div>
  </fieldset>

  <fieldset><legend>Site Detailed Report</legend>
    <label>Edit the whole report text here. Blank lines separate paragraphs.</label>
    <textarea id="detail" style="min-height:420px">2025 Monitoring Report #35

Date of Inspection: February 8, 2025
Time of Inspection: 12:30 hours
Weather Conditions: Fair

Inspection Summary
Due to the unusually high water levels observed during the inspection, the following actions were taken:

Action Taken:
A manual test of the pump's float was conducted to ensure the submersible pumps are operating properly.

Outcome:
The inspection confirmed that the submersible pumps are functioning properly and are in good working condition, ensuring uninterrupted service.

Recommendation:
It is recommended that the Town Council arrange for their building contractor to repair the source of water seepage, as it may become a mosquito breeding site soon. Please refer to the attached photos for updates.</textarea>
  </fieldset>

  <fieldset><legend>Countermeasures</legend>
    <div id="cmList"></div>
    <div class="bar"><button id="addCm" type="button">+ Add row</button></div>
  </fieldset>

  <fieldset><legend>Sign-off</legend>
    <label>Confirmation statement</label><input id="confirm" value="I hereby confirm that the mentioned work had been rectified/restored">
    <div class="row">
      <div><label>Prepared by</label><input id="prep" value="Chin Piang Sen"></div>
      <div><label>Role</label><input id="prepRole" value="Electrical Engineer"></div>
      <div><label>Verified by</label><input id="ver" value="MAK WAN YUEN"></div>
      <div><label>Role</label><input id="verRole" value="Town Council LEW"></div>
    </div>
  </fieldset>

  <fieldset><legend>Site photos</legend>
    <input id="files" type="file" accept="image/*" multiple>
    <div id="phList"></div>
  </fieldset>

  <div class="bar"><button class="pri" id="print" type="button">Print / Save as PDF</button><button id="reset" type="button">Clear photos</button></div>
</div>

<div class="prev"><div class="paper" id="paper"></div></div>
</div>

  <div class="refno">Reference No.: ${esc(v('ref'))}</div>
  <div class="title">LEW ATTENDANCE REPORT</div>
  <table class="k">
   <tr><td>Town Council:</td><td>${esc(v('tc'))}</td></tr>
   <tr><td>Town Address:</td><td>${esc(v('addr'))}</td></tr>
   <tr><td>Location (Outage):</td><td>${esc(v('loc'))}</td></tr>
   <tr><td>Date Activated:</td><td>${dmy(v('act'))}</td></tr>
   <tr><td>Time Arrived at site:</td><td>${dt(v('arr'))}</td></tr>
   <tr><td>Time Completed:</td><td>${dt(v('comp'))}</td></tr>
  </table>
  <div class="u" style="margin-bottom:2px">Site Detailed Report</div>
  <p>${esc(v('detail').trim())}</p>
  <table class="cm2"><tr><th style="width:56px">S/N</th><th>COUNTERMEASURES</th></tr>${rows}</table>
  <p style="margin-top:28px">${esc(v('confirm'))}</p>
  <div class="sig"><div>Prepared by:<div class="ln">${esc(v('prep'))}</div>${esc(v('prepRole'))}</div><div>Verified by:<div class="ln">${esc(v('ver'))}</div>${esc(v('verRole'))}</div></div>
  ${photos.length?`<div class="ph"><p style="margin:0 0 8px">Site Photos:</p><div class="grid">${figs}</div></div>`:''}`;
}
ids.forEach(k=>$(k).addEventListener('input',render));
$('addCm').onclick=()=>{cms.push('');renderCm();render()};
$('cmList').addEventListener('input',e=>{const i=e.target.dataset.cm;if(i!==undefined){cms[i]=e.target.value;render()}});
$('cmList').addEventListener('click',e=>{const i=e.target.dataset.rm;if(i!==undefined){cms.splice(i,1);if(!cms.length)cms=[''];renderCm();render()}});
$('files').addEventListener('change',async e=>{
  for(const f of e.target.files){
    const src=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    const n=photos.length+1;
    photos.push({src,stage:'Before',num:String(n),remark:'',ts:$('arr').value});
  }
  e.target.value='';renderPh();render();
});
$('phList').addEventListener('input',e=>{const{i,k}=e.target.dataset;if(k){photos[i][k]=e.target.value;render()}});
$('phList').addEventListener('click',e=>{const i=e.target.dataset.del;if(i!==undefined){photos.splice(i,1);renderPh();render()}});
$('reset').onclick=()=>{photos=[];renderPh();render()};
$('print').onclick=()=>window.print();
renderCm();renderPh();render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
